      <stop stop-color="#0B111B"/>
      <stop offset="1" stop-color="#050D14"/>
    </linearGradient>
    <linearGradient id="s-hex-stroke" x1="96" y1="48" x2="224" y2="192" gradientUnits="userSpaceOnUse">
